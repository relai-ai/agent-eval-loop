<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How RELAI works, in three phases: learn from evidence, build and run evals, improve. For your agent, discover builds the EvalsWiki from its code, docs and traces, and eval builds Harbor-format tasks from traces or generated from risks. For your coding agents, coding-evals mines sessions, pull requests and git history for tasks any coding agent can run and compares agents and setups. improve keeps a change only if it helps with no regressions; the loop skill repeats this when new traces arrive. You review the risks, approve the evals and set the goal and budget.</title>
<rect width="1200" height="448" rx="20" fill="#121513"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d625e"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf8c"/></marker></defs>
<text x="34" y="40" font-size="13" font-weight="700" fill="#9d9c95" letter-spacing="1.5">LEARN FROM EVIDENCE</text>
<text x="430" y="40" font-size="13" font-weight="700" fill="#9d9c95" letter-spacing="1.5">BUILD AND RUN EVALS</text>
<text x="826" y="40" font-size="13" font-weight="700" fill="#9d9c95" letter-spacing="1.5">IMPROVE</text>
<rect x="30" y="58" width="348" height="124" rx="14" fill="#1d221f"/>
<text x="52" y="96" font-size="22" font-weight="700" fill="#ecebe6">discover</text>
<text x="52" y="121" font-size="16" font-weight="600" fill="#5fbf8c">your agent</text>
<text x="52" y="148" font-size="15" font-weight="400" fill="#9d9c95">EvalsWiki: the map of its behavior,</text>
<text x="52" y="168" font-size="15" font-weight="400" fill="#9d9c95">from code, docs and traces</text>
<rect x="426" y="58" width="348" height="124" rx="14" fill="#1d221f"/>
<text x="448" y="96" font-size="22" font-weight="700" fill="#ecebe6">eval</text>
<text x="448" y="121" font-size="16" font-weight="600" fill="#5fbf8c">Harbor-format tasks</text>
<text x="448" y="148" font-size="15" font-weight="400" fill="#9d9c95">from traces, or generated from</text>
<text x="448" y="168" font-size="15" font-weight="400" fill="#9d9c95">risks; frozen, then run and scored</text>
<line x1="384" y1="120" x2="418" y2="120" stroke="#5d625e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="198" width="744" height="108" rx="14" fill="#1d221f"/>
<text x="52" y="242" font-size="22" font-weight="700" fill="#ecebe6">coding-evals</text>
<text x="52" y="268" font-size="16" font-weight="600" fill="#5fbf8c">your coding agents</text>
<text x="280" y="234" font-size="15" font-weight="400" fill="#9d9c95">Mines sessions, pull requests and git history for</text>
<text x="280" y="256" font-size="15" font-weight="400" fill="#9d9c95">tasks any coding agent can run; compares agents,</text>
<text x="280" y="278" font-size="15" font-weight="400" fill="#9d9c95">models and setups on your own code</text>
<rect x="822" y="58" width="348" height="248" rx="14" fill="#1d221f"/>
<text x="844" y="96" font-size="22" font-weight="700" fill="#ecebe6">improve</text>
<text x="844" y="121" font-size="16" font-weight="600" fill="#5fbf8c">verified changes</text>
<text x="844" y="150" font-size="15" font-weight="400" fill="#9d9c95">kept only if they help,</text>
<text x="844" y="170" font-size="15" font-weight="400" fill="#9d9c95">with no regressions</text>
<text x="844" y="210" font-size="15" font-weight="400" fill="#9d9c95">your agent: prompts, tools,</text>
<text x="844" y="230" font-size="15" font-weight="400" fill="#9d9c95">workflow, memory or model</text>
<text x="844" y="270" font-size="15" font-weight="400" fill="#9d9c95">coding agents: CLAUDE.md,</text>
<text x="844" y="290" font-size="15" font-weight="400" fill="#9d9c95">skills and hooks</text>
<line x1="780" y1="120" x2="814" y2="120" stroke="#5d625e" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="780" y1="252" x2="814" y2="252" stroke="#5d625e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="322" width="348" height="34" rx="17" fill="#22302a"/>
<circle cx="52" cy="339" r="5" fill="#5fbf8c"/>
<text x="66" y="344" font-size="14" font-weight="600" fill="#ecebe6">you review the risks</text>
<rect x="426" y="322" width="348" height="34" rx="17" fill="#22302a"/>
<circle cx="448" cy="339" r="5" fill="#5fbf8c"/>
<text x="462" y="344" font-size="14" font-weight="600" fill="#ecebe6">you approve evals + grading</text>
<rect x="822" y="322" width="348" height="34" rx="17" fill="#22302a"/>
<circle cx="844" cy="339" r="5" fill="#5fbf8c"/>
<text x="858" y="344" font-size="14" font-weight="600" fill="#ecebe6">you set goal + budget</text>
<path d="M 996 362 V 408 H 204 V 366" fill="none" stroke="#5fbf8c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowA)"/>
<rect x="414" y="390" width="373" height="36" rx="18" fill="#121513" stroke="#5fbf8c" stroke-width="2"/>
<text x="600" y="413" font-size="15" font-weight="700" text-anchor="middle" fill="#5fbf8c">loop · when new traces arrive: learn, test, fix</text>
</svg>
