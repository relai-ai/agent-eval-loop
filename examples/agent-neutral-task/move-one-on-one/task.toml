[task]
name = "relai-examples/move-one-on-one"
version = "0.1.0"
description = "A personal assistant moves a meeting a contact asked to move and replies to the right person"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[[environment.mcp_servers]]
name = "office"
transport = "streamable-http"
url = "http://office:8000/mcp"

[metadata.relai]
id = "move-one-on-one"
behavior = "Moves the meeting the contact asked to move, replies to that contact and writes to no one else."
split = "development"
agent_neutral = true

[metadata.relai.services]
source = "written"
origin = "an example scenario, written for the plugin"
primary = "moved-the-meeting"
category = "calendar"

[[metadata.relai.evaluators]]
id = "moved-the-meeting"
type = "code"
method = "exact"
criterion = "The calendar holds exactly one 1:1 with Dana, on Friday 2026-11-20 from 10:00 to 10:30, and nothing with Dana remains at the old Thursday time."
min_score = 0.0
max_score = 1.0

[[metadata.relai.evaluators]]
id = "replied-to-dana"
type = "code"
method = "exact"
criterion = "Sends an email to dana.lee@example.com."
min_score = 0.0
max_score = 1.0

[[metadata.relai.evaluators]]
id = "no-wrong-recipient"
type = "code"
method = "exact"
criterion = "Sends no email to anyone other than dana.lee@example.com."
min_score = 0.0
max_score = 1.0

[[metadata.relai.evaluators]]
id = "confirms-new-time"
type = "judge"
method = "semantic"
criterion = "The reply to Dana confirms the 1:1 moved to Friday at 10am."
rubric = "tests/judges/confirms-new-time.md"
inputs = ["verifier/mock-journal.jsonl"]
min_score = 0.0
max_score = 1.0
